  /* scrim: heavy on the left so the copy reads, clear on the right */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(9, 11, 14, 0.92) 0%, rgba(9, 11, 14, 0.8) 34%, rgba(9, 11, 14, 0.35) 50%, rgba(9, 11, 14, 0.08) 64%, transparent 78%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 64px 24px;
  }
  .copy { max-width: 520px; }

  .eyebrow {
    color: #c9a35f;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1 {
    font-family: Fraunces, serif;
    font-weight: 700;
    font-size: clamp(2rem, 5.4vw, 3.2rem);
    line-height: 1.1;
    color: #fff;
    margin-bottom: 24px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
  }
  .rule {
    width: 130px;
    height: 1px;
    margin-bottom: 26px;
    background: linear-gradient(90deg, rgba(201, 163, 95, 0.95), transparent);
  }
  p.lead {
    color: #ded9d0;
    font-size: 1.08rem;
    margin-bottom: 14px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  p.note {
    color: #a7a299;
    font-size: 0.96rem;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
  }

  @media (max-width: 760px) {
    body { align-items: flex-end; }
    /* whole photo across the top, copy in the clear space beneath it */
    body::before { background-position: center top; }
    body::after {
      background: linear-gradient(180deg, transparent 0%, transparent 46%, rgba(9, 11, 14, 0.55) 58%, rgba(9, 11, 14, 0.96) 70%, #0d1013 100%);
    }
    main { padding: 0 24px 54px; }
    .copy { max-width: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="copy">
      <p class="eyebrow">A New Chapter</p>
      <h1>We're moving to a new name and a new home.</h1>
      <div class="rule"></div>
      <p class="lead">
        Something bigger is being built — a new brand, a new address, and a new
        standard for the coaching we deliver.
      </p>
      <p class="note">We'll be back online shortly. Thank you for your patience.</p>
    </div>
  </main>
</body>
