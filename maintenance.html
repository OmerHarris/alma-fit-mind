<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>We're Moving</title>
<meta name="description" content="We're moving to a new name and a new home. Back online shortly." />
<meta name="robots" content="noindex" />

<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="theme-color" content="#0d1013" />

<meta property="og:type" content="website" />
<meta property="og:title" content="We're Moving" />
<meta property="og:description" content="We're moving to a new name and a new home. Back online shortly." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: #0d1013;
    color: #f4f1ea;
    font-family: Inter, system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* photo backdrop */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("images/moving-bg.jpg") 82% 20% / cover no-repeat;
  }
  /* scrim: heavy on the left so the copy reads, clear on the right */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(9, 11, 14, 0.94) 0%, rgba(9, 11, 14, 0.86) 30%, rgba(9, 11, 14, 0.5) 52%, rgba(9, 11, 14, 0.12) 70%, rgba(9, 11, 14, 0.05) 100%),
      linear-gradient(180deg, rgba(9, 11, 14, 0.5) 0%, transparent 26%, transparent 74%, rgba(9, 11, 14, 0.6) 100%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 64px 24px;
  }
  .copy { max-width: 520px; }

  .eyebrow {
    color: #c9a35f;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1 {
    font-family: Fraunces, serif;
    font-weight: 700;
    font-size: clamp(2rem, 5.4vw, 3.2rem);
    line-height: 1.1;
    color: #fff;
    margin-bottom: 24px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
  }
  .rule {
    width: 130px;
    height: 1px;
    margin-bottom: 26px;
    background: linear-gradient(90deg, rgba(201, 163, 95, 0.95), transparent);
  }
  p.lead {
    color: #ded9d0;
    font-size: 1.08rem;
    margin-bottom: 14px;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
  }
  p.note {
    color: #a7a299;
    font-size: 0.96rem;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
  }

  @media (max-width: 760px) {
    body { align-items: flex-end; }
    body::before { background-position: center 18%; }
    /* on a narrow screen the copy sits over the bottom, so darken downward */
    body::after {
      background: linear-gradient(180deg, rgba(9, 11, 14, 0.45) 0%, rgba(9, 11, 14, 0.25) 34%, rgba(9, 11, 14, 0.82) 62%, rgba(9, 11, 14, 0.96) 100%);
    }
    main { padding: 0 24px 60px; }
    .copy { max-width: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="copy">
      <p class="eyebrow">A New Chapter</p>
      <h1>We're moving to a new name and a new home.</h1>
      <div class="rule"></div>
      <p class="lead">
        Something bigger is being built — a new brand, a new address, and a new
        standard for the coaching we deliver.
      </p>
      <p class="note">We'll be back online shortly. Thank you for your patience.</p>
    </div>
  </main>
</body>
</html>
